name: Validate third

on:
  push:
    branches:
      - third
    paths:
      - '.github/workflows/validate-third.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
