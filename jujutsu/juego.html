<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cargando campaña…</title></head><body><p id="status">Cargando motor compartido…</p><script>
(function(){
  var CAMPAIGN="jujutsu";
  try{var u=new URL(location.href);u.searchParams.set('campana',CAMPAIGN);history.replaceState(null,'',u.pathname+u.search+u.hash);}catch(e){}
  fetch('../juego.html',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(html){
    html=html.replace(/<head([^>]*)>/i,'<head$1><base href="../">');
    document.open();document.write(html);document.close();
  }).catch(function(err){
    document.getElementById('status').innerHTML='No se pudo cargar el motor compartido. <a href="../juego.html?campana='+encodeURIComponent(CAMPAIGN)+'">Abrir campaña directamente</a>.';
  });
})();
</script></body></html>
